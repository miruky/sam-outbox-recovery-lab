    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
  AggregateQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: 処理失敗と配送失敗を記録する独立したキュー。
        must:
        - 暗号化を無効にしない。
    Properties:
      QueueName:
        Ref: AggregateQueueName
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 86400
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - AggregateDLQ
          - Arn
        maxReceiveCount: 5
  NotificationQueue:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: 処理失敗と配送失敗を記録する独立したキュー。
