    Properties:
      QueueName:
        Ref: NotificationQueueName
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 86400
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - NotificationDLQ
          - Arn
        maxReceiveCount: 5
  RebuildQueue:
    Type: AWS::SQS::Queue
