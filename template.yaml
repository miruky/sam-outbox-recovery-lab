        why: 処理失敗と配送失敗を記録する独立したキュー。
        must:
        - 暗号化を無効にしない。
    Properties:
      QueueName:
        Ref: AggregateDLQName
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
  NotificationDLQ:
