  OrderBus:
    Type: AWS::Events::EventBus
    Metadata:
      com.aws.cloudformation.Context:
        why: 通常イベントとアーカイブ再生の元バス。
        must:
        - 再生先は同じバスに限定する。
    Properties:
      Name:
        Ref: OrderBusName
  OrderArchive:
    Type: AWS::Events::Archive
    Metadata:
      com.aws.cloudformation.Context:
        why: 成功して届いた業務イベントを再構築に使う。
        must:
        - 未送信Outboxは別途回収する。
    Properties:
      ArchiveName:
        Ref: OrderArchiveName
      SourceArn:
        Fn::GetAtt:
        - OrderBus
        - Arn
      RetentionDays: 1
      EventPattern:
        source:
        - lab.orders
        detail-type:
        - OrderCreated
  AggregateRule:
    Type: AWS::Events::Rule
    Metadata:
      com.aws.cloudformation.Context:
        why: 通常配送と再生の宛先をイベント条件でも分離する。
        must:
        - 再生イベントを通知へ配送しない。
    Properties:
      Name:
        Ref: AggregateRuleName
      EventBusName:
        Ref: OrderBus
      EventPattern:
        source:
        - lab.orders
        detail-type:
        - OrderCreated
        replay-name:
        - exists: false
      State: ENABLED
      Targets:
      - Id: Aggregate
        Arn:
          Fn::GetAtt:
          - AggregateQueue
          - Arn
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - DeliveryDLQ
            - Arn
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 300
  NotificationRule:
    Type: AWS::Events::Rule
    Metadata:
      com.aws.cloudformation.Context:
        why: 通常配送と再生の宛先をイベント条件でも分離する。
        must:
        - 再生イベントを通知へ配送しない。
    Properties:
      Name:
        Ref: NotificationRuleName
      EventBusName:
        Ref: OrderBus
      EventPattern:
        source:
        - lab.orders
        detail-type:
        - OrderCreated
        replay-name:
        - exists: false
      State: ENABLED
      Targets:
      - Id: Notification
        Arn:
          Fn::GetAtt:
          - NotificationQueue
          - Arn
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - DeliveryDLQ
            - Arn
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 300
  RebuildRule:
    Type: AWS::Events::Rule
    Metadata:
      com.aws.cloudformation.Context:
        why: 通常配送と再生の宛先をイベント条件でも分離する。
        must:
        - 再生イベントを通知へ配送しない。
    Properties:
      Name:
        Ref: RebuildRuleName
      EventBusName:
        Ref: OrderBus
      EventPattern:
        source:
        - lab.orders
        detail-type:
        - OrderCreated
        replay-name:
        - exists: true
      State: ENABLED
      Targets:
      - Id: Rebuild
        Arn:
          Fn::GetAtt:
          - RebuildQueue
          - Arn
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - DeliveryDLQ
            - Arn
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 300
  AggregateQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: AggregateQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Deny
          Principal: '*'
          Action: sqs:*
          Resource:
            Fn::GetAtt:
            - AggregateQueue
            - Arn
          Condition:
            Bool:
              aws:SecureTransport: 'false'
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - AggregateQueue
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - AggregateRule
                - Arn
            StringEquals:
              aws:SourceAccount:
                Ref: AWS::AccountId
  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
