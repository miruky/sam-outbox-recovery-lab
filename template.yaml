Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      com.aws.cloudformation.Context:
        why: 合成注文と復旧対象だけを保持する。
        must:
        - 本番データを入れない。
        - 単一リージョンのトランザクションを使う。
    Properties:
      TableName:
        Ref: OrdersTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_IMAGE
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
  ControlTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      com.aws.cloudformation.Context:
