      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
  AggregateTable:
